name: Build and Push

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".env.example"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Restore Next.js build cache
        id: nextjs-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nextjs-cache
          key: nextjs-${{ matrix.artifact }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ matrix.artifact }}-

      - name: Ensure cache dir exists
        run: mkdir -p /tmp/nextjs-cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-contexts: nextjscache=/tmp/nextjs-cache
          outputs: type=image,name=ghcr.io/claudeailab/remotecat,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: Extract Next.js cache from build
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target cache-export \
            --build-context nextjscache=/tmp/nextjs-cache \
            --cache-from type=gha,scope=${{ matrix.artifact }} \
            --output type=local,dest=/tmp/nextjs-cache-new \
            .

      - name: Save Next.js build cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/nextjs-cache-new
          key: nextjs-${{ matrix.artifact }}-${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat version.json | jq -r .version)" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/claudeailab/remotecat:latest \
            -t "ghcr.io/claudeailab/remotecat:v${{ steps.version.outputs.version }}" \
            $(printf 'ghcr.io/claudeailab/remotecat@sha256:%s ' *)
